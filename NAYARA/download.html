<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Strict No-Cache Headers -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <title>RO Data Table</title>
    
    <!-- Stylesheet and Libraries -->
    <link rel="stylesheet" href="table.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.0/xlsx.full.min.js"></script>
    <script class="u-script" type="text/javascript" src="table.js?v=1.3" defer></script>

    <script>
      // Safe Authentication and Session Handling
      function reloadHomePage() {
        if (window.top !== window.self) {
          window.top.location.href = "../home.html";
        } else {
          window.location.href = "../home.html";
        }
      }

      function resetLocalStorageOnBrowserClose() {
        const sessionKey = 'sessionActive';
        const currentSession = sessionStorage.getItem(sessionKey);

        if (!currentSession) {
          localStorage.setItem("name", "logout");
          localStorage.setItem("state", "");
          localStorage.setItem("role", "");
          localStorage.setItem("username", "");
          localStorage.setItem("account_status", "");
          sessionStorage.setItem(sessionKey, 'true');
        }
      }

      // Login check logic
      var nitin = localStorage.getItem("name");
      if (nitin !== "secrate") {
        window.location.replace("../index.html");
        reloadHomePage();
      }

      // Logout or timeout logic
      if (localStorage.getItem('name') === 'logout') {
        window.location.replace('../index.html');
      } else {
        // Safe check: Only set value if element actually exists on the page
        const username = localStorage.getItem('username');
        window.addEventListener("DOMContentLoaded", function () {
          const empInput = document.getElementById('audit_conducted_person_name');
          if (username && empInput) {
            empInput.value = username;
          }
        });

        // Session timeout logic (30 minutes)
        var sessionTimeout = setTimeout(logoutUser, 1800000);

        function logoutUser() {
          localStorage.setItem("name", "logout");
          localStorage.setItem("state", "");
          localStorage.setItem("role", "");
          localStorage.setItem("username", "");
          localStorage.setItem("account_status", "");
          window.location.replace('../index.html');
          reloadHomePage();
        }

        // Reset timeout on user activity
        window.addEventListener('mousemove', function () {
          clearTimeout(sessionTimeout);
          sessionTimeout = setTimeout(logoutUser, 1800000);
        });
      }
    </script>
  </head>

  <body onload="hide()">
